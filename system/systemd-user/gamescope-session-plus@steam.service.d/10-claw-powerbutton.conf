# /etc/systemd/user/gamescope-session-plus@steam.service.d/10-claw-powerbutton.conf
# The "steam" session (SDDM autologin: gamescope-session-steam.desktop) does not want
# steamos-powerbuttond. Only gamescope-session-plus@ogui-steam.service pulls it in, via
# /usr/lib/systemd/user/gamescope-session-plus@ogui-steam.service.wants/. Without the
# daemon the physical power button does nothing after a boot into the steam session.
[Unit]
Wants=steamos-powerbuttond.service
