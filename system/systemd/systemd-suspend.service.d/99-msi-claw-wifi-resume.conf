# Start the WiFi resume watchdog after every suspend (power button and systemctl suspend).
# systemd-run --no-block puts it in its own transient unit, so it is not killed when
# this oneshot unit finishes. Failures are ignored ("-").
[Service]
ExecStartPost=-/usr/bin/systemd-run --no-block --collect /usr/local/bin/claw-wifi-resume-watchdog.sh
