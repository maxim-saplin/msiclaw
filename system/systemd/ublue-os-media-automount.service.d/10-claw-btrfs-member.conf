# /etc/systemd/system/ublue-os-media-automount.service.d/10-claw-btrfs-member.conf
# The automount script also tries /dev/nvme0n1p7, which is a member device of the root
# btrfs filesystem (label "bazzite", same UUID as /dev/nvme0n1p6, mounted at
# /run/media/system/bazzite). systemd-mount refuses because the transient mount unit
# already exists, so the script exits 1 on every boot even though p6 is mounted.
# Count that exit as success so the unit doesn't show failed. Remove this drop-in if
# the script learns to skip btrfs member devices.
[Service]
SuccessExitStatus=1
